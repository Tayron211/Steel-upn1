<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-50 dark:bg-black text-slate-900 dark:text-zinc-100">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('upn_theme');
          var supportDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (theme === 'dark' || (!theme && supportDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#000000';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f8fafc';
          }
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UPN Control" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#FDBA30" />
    <link rel="manifest" href="/manifest.json" />
    <title>UPN · Control Docente & Operaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-50 dark:bg-black text-slate-800 dark:text-zinc-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-[#FDBA30] selection:text-slate-950 overscroll-none touch-manipulation">
    <div id="root" class="h-full bg-slate-50 dark:bg-black">
      <!-- Instant Pre-React Institutional Splash Screen -->
      <div id="upn-boot-splash" style="position:fixed;inset:0;background-color:#000000;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:99999;user-select:none;-webkit-user-select:none;font-family:'Plus Jakarta Sans',sans-serif;color-scheme:dark;">
        <div style="padding-top:2.75rem;font-size:10px;text-transform:uppercase;font-family:monospace;letter-spacing:0.3em;color:#52525b;font-weight:500;">
          Universidad Privada del Norte
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 1.5rem;margin-top:-1.5rem;">
          <div style="width:5rem;height:5rem;border-radius:1rem;background-color:#FDBA30;box-shadow:0 0 35px rgba(253,186,48,0.22);display:flex;align-items:center;justify-content:center;padding:0.75rem;margin-bottom:1.5rem;">
            <img src="/icon.svg" alt="UPN" style="width:100%;height:100%;object-fit:contain;" />
          </div>
          <h1 style="font-size:1.25rem;font-weight:700;letter-spacing:0.22em;color:#FFFFFF;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.2;">
            Control Docente
          </h1>
          <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;font-size:11px;font-family:monospace;letter-spacing:0.15em;color:#a1a1aa;text-transform:uppercase;font-weight:600;">
            <span>Sede Comas</span>
            <span style="display:inline-block;width:4px;height:4px;border-radius:9999px;background-color:#52525b;"></span>
            <span style="color:#fbbf24;">Operaciones</span>
          </div>
          <div style="width:9rem;height:2px;background-color:rgba(39,39,42,0.9);border-radius:9999px;margin-top:2rem;overflow:hidden;position:relative;">
            <div style="position:absolute;top:0;bottom:0;left:0;width:50%;background-color:#FDBA30;border-radius:9999px;box-shadow:0 0 10px rgba(253,186,48,0.6);"></div>
          </div>
        </div>
        <div style="padding-bottom:2.25rem;font-size:10px;font-family:monospace;color:#71717a;text-transform:uppercase;letter-spacing:0.15em;">
          <span>Sistema Integrado 2026 • v2.6</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
