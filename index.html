<!DOCTYPE html>
<html lang="es" class="h-full" style="background-color:#000000;">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        background-color: #000000 !important;
        margin: 0;
        padding: 0;
      }
      @keyframes splashProgress {
        0% { left: 0%; width: 0%; opacity: 0.5; }
        50% { left: 25%; width: 60%; opacity: 1; }
        100% { left: 100%; width: 15%; opacity: 0.3; }
      }
    </style>
    <script>
      (function() {
        try {
          var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
          function applyTheme() {
            var saved = localStorage.getItem('upn_theme');
            var isDark = saved ? (saved === 'dark') : (mq ? mq.matches : true);
            if (isDark) {
              document.documentElement.classList.add('dark');
              document.documentElement.setAttribute('data-mode', 'dark');
            } else {
              document.documentElement.classList.remove('dark');
              document.documentElement.setAttribute('data-mode', 'light');
            }
          }
          applyTheme();
          if (mq) {
            if (mq.addEventListener) mq.addEventListener('change', applyTheme);
            else if (mq.addListener) mq.addListener(applyTheme);
          }
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UPN Control" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <title>UPN · Control Docente & Operaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-slate-50 dark:bg-black text-slate-800 dark:text-zinc-100 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-[#FDBA30] selection:text-slate-950 overscroll-none touch-manipulation" style="background-color:#000000;">
    <!-- Sovereign Splash Screen: rendered OUTSIDE #root so React createRoot never wipes or glitches it -->
    <div id="upn-boot-splash" style="position:fixed;inset:0;background-color:#000000;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:999999;user-select:none;-webkit-user-select:none;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color-scheme:dark;">
      <!-- Subtle Ambient Glow -->
      <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:22rem;height:22rem;border-radius:9999px;background:radial-gradient(circle, rgba(253,186,48,0.2) 0%, rgba(0,0,0,0) 70%);pointer-events:none;filter:blur(40px);"></div>
      
      <!-- Top Institutional Label -->
      <div style="padding-top:2.75rem;font-size:10px;text-transform:uppercase;font-family:monospace;letter-spacing:0.3em;color:#52525b;font-weight:500;position:relative;z-index:2;">
        Universidad Privada del Norte
      </div>
      
      <!-- Center Identity Core -->
      <div style="display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 1.5rem;margin-top:-1.5rem;position:relative;z-index:2;">
        <div style="width:5rem;height:5rem;border-radius:1.1rem;background-color:#FDBA30;box-shadow:0 0 35px rgba(253,186,48,0.22);display:flex;align-items:center;justify-content:center;padding:0.75rem;margin-bottom:1.5rem;border:1px solid rgba(255,255,255,0.1);">
          <img src="/icon.svg" alt="UPN" style="width:100%;height:100%;object-fit:contain;" />
        </div>
        <h1 style="font-size:1.25rem;font-weight:700;letter-spacing:0.22em;color:#FFFFFF;text-transform:uppercase;font-family:'Space Grotesk',sans-serif;margin:0;line-height:1.2;">
          Control Docente
        </h1>
        <div style="display:flex;align-items:center;gap:0.5rem;margin-top:0.5rem;font-size:11px;font-family:monospace;letter-spacing:0.15em;color:#a1a1aa;text-transform:uppercase;font-weight:600;">
          <span>Campus Comas</span>
          <span style="display:inline-block;width:4px;height:4px;border-radius:9999px;background-color:#52525b;"></span>
          <span style="color:#fbbf24;">Operaciones</span>
        </div>
        <!-- Hairline Loader -->
        <div style="width:9rem;height:2px;background-color:rgba(39,39,42,0.9);border-radius:9999px;margin-top:2rem;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;bottom:0;left:0;background-color:#FDBA30;border-radius:9999px;box-shadow:0 0 10px rgba(253,186,48,0.6);animation:splashProgress 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
      </div>
      
      <!-- Footer -->
      <div style="padding-bottom:2.25rem;font-size:10px;font-family:monospace;color:#71717a;text-transform:uppercase;letter-spacing:0.15em;position:relative;z-index:2;">
        <span>Sistema Integrado 2026 • v2.6</span>
      </div>
    </div>

    <!-- React App Container -->
    <div id="root" class="h-full bg-slate-50 dark:bg-black"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
