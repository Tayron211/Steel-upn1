<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="upnLucuma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC533"/>
      <stop offset="100%" stop-color="#FDBA30"/>
    </linearGradient>
  </defs>
  <!-- Background UPN Lúcuma Rounded Square -->
  <rect width="512" height="512" rx="128" fill="url(#upnLucuma)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#000000" stroke-width="8" stroke-opacity="0.1"/>

  <!-- North Arrow Graphic Symbol (Flecha al Norte) -->
  <path d="M220 120 L392 120 L392 292 M392 120 L160 352" 
        stroke="#000000" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>

  <!-- UPN Wordmark in Sharp Grotesque Geometry -->
  <text x="70" y="440" 
        font-family="system-ui, -apple-system, 'Space Grotesk', sans-serif" 
        font-weight="900" 
        font-size="140" 
        letter-spacing="-6" 
        fill="#000000">UPN</text>
</svg>
